<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - Learn Math</title>
    <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="/public/images/logo-aicloud.png" alt="AI Cloud Logo">
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="user-login.html">User Login</a></li>
                <li><a href="user-signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="login-form">
            <h2>User Login</h2>
            <form>
                <label for="user-email">Email:</label>
                <input type="email" id="user-email" name="user-email" required>
                <label for="user-password">Password:</label>
                <input type="password" id="user-password" name="user-password" required>
                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="user-signup.html">Sign up here</a></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Learn Math. All rights reserved.</p>
    </footer>
</body>
</html>
