<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Learn Math</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            background-color: #1a1a1a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            padding: 15px 0;
        }

        .navbar-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
        }

        .logo-group {
            display: flex;
            gap: 15px;
            align-items: center;
            background-color: #ffffff;
            padding: 5px;
            border-radius: 4px;
        }

        .logo-aicloud {
            height: 50px;
            width: auto;
            cursor: pointer;
        }

        .logo-iiskills {
            height: 50px;
            width: auto;
            cursor: pointer;
        }

        .title-container {
            flex: 1;
        }

        .navbar-title {
            font-size: 1.5rem;
            color: #ffffff;
            font-weight: 600;
            margin: 0;
        }

        .admin-badge {
            background: #e74c3c;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Main Content */
        .auth-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-box {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .auth-header .admin-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .auth-header p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #e74c3c;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar-title {
                font-size: 1.2rem;
            }

            .logo-group {
                flex-direction: column;
                gap: 8px;
            }

            .logo-aicloud,
            .logo-iiskills {
                height: 35px;
            }

            .auth-box {
                padding: 30px 20px;
            }
        }

        @media (max-width: 480px) {
            .logo-group {
                flex-direction: row;
                gap: 10px;
            }
            
            .logo-aicloud,
            .logo-iiskills {
                height: 30px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo-group">
                <a href="/"><img src="/images/logo-aicloud.svg" alt="AI Cloud Enterprises" class="logo logo-aicloud"></a>
                <a href="/"><img src="/images/logo-iiskills.svg" alt="iiskills" class="logo logo-iiskills"></a>
            </div>
            <div class="title-container">
                <h1 class="navbar-title">Indian Institute of Professional Skills Development</h1>
            </div>
            <div class="admin-badge">ADMIN</div>
        </div>
    </nav>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="admin-icon">🔐</div>
                <h2>Admin Portal</h2>
                <p>Secure administrator access</p>
            </div>

            <div id="loginMessage" class="message"></div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminEmail">Admin Email</label>
                    <input type="email" id="adminEmail" name="email" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" class="submit-btn">Login to Admin Portal</button>
            </form>

            <div class="back-link">
                <a href="/">← Back to Main Site</a>
            </div>
        </div>
    </div>

    <script>
        // Handle admin login form submission
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                email: document.getElementById('adminEmail').value,
                password: document.getElementById('adminPassword').value
            };

            const messageEl = document.getElementById('loginMessage');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    // Check if user is admin
                    if (data.user.role === 'admin') {
                        messageEl.textContent = 'Login successful! Redirecting to admin dashboard...';
                        messageEl.className = 'message success show';
                        
                        // Redirect to admin dashboard
                        setTimeout(() => {
                            window.location.href = '/admin/dashboard';
                        }, 1000);
                    } else {
                        messageEl.textContent = 'Access denied. Admin credentials required.';
                        messageEl.className = 'message error show';
                    }
                } else {
                    messageEl.textContent = data.message;
                    messageEl.className = 'message error show';
                }
            } catch (error) {
                messageEl.textContent = 'Network error. Please try again.';
                messageEl.className = 'message error show';
                console.error('Login error:', error);
            }
        });

        // Check if already logged in as admin
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/auth/status');
                const data = await response.json();
                
                if (data.authenticated && data.user.role === 'admin') {
                    // Already logged in as admin, redirect to dashboard
                    window.location.href = '/admin/dashboard';
                }
            } catch (error) {
                console.error('Error checking auth status:', error);
            }
        });
    </script>
</body>
</html>
