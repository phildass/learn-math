<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Learn Math</title>
    <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="/public/images/logo-aicloud.png" alt="AI Cloud Logo">
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="user-login.html">User Login</a></li>
                <li><a href="user-signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="signup-form">
            <h2>Create Your Account</h2>
            <form>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="signup-email">Email:</label>
                <input type="email" id="signup-email" name="signup-email" required>
                <label for="signup-password">Password:</label>
                <input type="password" id="signup-password" name="signup-password" required>
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
                <button type="submit">Sign Up</button>
            </form>
            <p>Already have an account? <a href="user-login.html">Login here</a></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Learn Math. All rights reserved.</p>
    </footer>
</body>
</html>
